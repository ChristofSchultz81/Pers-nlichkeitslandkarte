<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persönlichkeits-Landkarte / Personality Map</title>
<style>
  * { box-sizing: border-box; }
  body { color: var(--foreground, #1b1b1f); }

  h1 { font-size: 1.35em; margin: 0 0 2px 0; }
  h2 { font-size: 1.05em; margin: 24px 0 6px 0; padding-bottom: 4px; border-bottom: 1px solid var(--border, #dcdce2); }
  h3 { font-size: 0.95em; margin: 18px 0 2px 0; }
  h4 { font-size: 0.9em; margin: 14px 0 4px 0; }
  .muted { color: var(--muted-foreground, #6b6b76); }
  p.hint { color: var(--muted-foreground, #6b6b76); font-size: 0.85em; margin: 2px 0 12px 0; line-height: 1.45; }

  .langbar { display: flex; align-items: center; gap: 8px; margin: 10px 0 2px 0; font-size: 0.82em; }
  .switch { position: relative; width: 104px; height: 28px; border-radius: 16px; cursor: pointer;
            border: 1px solid var(--border, #dcdce2); background: var(--card, #f4f4f7); user-select: none; }
  .switch .knob { position: absolute; top: 2px; left: 2px; width: 50px; height: 22px; border-radius: 12px;
            background: var(--accent, #4f7cff); transition: left .18s ease; }
  .switch.en .knob { left: 51px; }
  .switch span { position: absolute; top: 0; height: 28px; line-height: 28px; width: 52px; text-align: center;
            font-size: 0.78em; font-weight: 600; z-index: 1; }
  .switch span.de { left: 0; } .switch span.en { right: 0; }
  .switch.de span.de, .switch.en span.en { color: #fff; }
  .switch.de span.en, .switch.en span.de { color: var(--muted-foreground, #6b6b76); }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 4px 0; }
  .tabs button { background: var(--card, #f4f4f7); color: var(--foreground, #1b1b1f);
    border: 1px solid var(--border, #dcdce2); border-radius: 8px; padding: 8px 13px;
    font-size: 0.86em; cursor: pointer; font-family: inherit; }
  .tabs button.active { background: var(--accent, #4f7cff); color: #fff; border-color: var(--accent, #4f7cff); }
  .panel { display: none; padding-top: 6px; }
  .panel.active { display: block; }

  .q { display: grid; grid-template-columns: minmax(200px, 1fr) auto; gap: 10px;
       align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border, #dcdce2); font-size: 0.88em; }
  .q .qtext { line-height: 1.35; }
  .scale { display: flex; gap: 4px; }
  .scale button { width: 30px; height: 28px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border, #dcdce2); background: transparent;
    color: var(--muted-foreground, #6b6b76); font-size: 0.82em; font-family: inherit; }
  .scale button.on { background: var(--accent, #4f7cff); color: #fff; border-color: var(--accent, #4f7cff); }
  .scalelegend { font-size: 0.76em; color: var(--muted-foreground, #6b6b76); margin: 2px 0 10px 0; }

  .block { border: 1px solid var(--border, #dcdce2); border-radius: 10px; padding: 12px 14px;
           background: var(--card, #f8f8fb); margin-bottom: 14px; }
  .progress { font-size: 0.78em; color: var(--muted-foreground, #6b6b76); margin: 6px 0 0 0; }
  .bar { height: 6px; background: var(--border, #dcdce2); border-radius: 4px; overflow: hidden; margin-top: 4px; max-width: 320px; }
  .bar > div { height: 100%; background: var(--accent, #4f7cff); width: 0%; }

  textarea { width: 100%; min-height: 64px; background: transparent; color: var(--foreground, #1b1b1f);
    border: 1px solid var(--border, #dcdce2); border-radius: 6px; padding: 7px; font-size: 0.85em;
    resize: vertical; font-family: inherit; }

  .tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 6px; }
  .tag { border: 1px solid var(--border, #dcdce2); border-radius: 20px; padding: 6px 13px;
         font-size: 0.84em; cursor: pointer; user-select: none; background: var(--card, #f4f4f7); }
  .tag.on { background: var(--accent, #4f7cff); color: #fff; border-color: var(--accent, #4f7cff); }

  button.btn { background: var(--accent, #4f7cff); color: #fff; border: none; border-radius: 7px;
    padding: 8px 15px; font-size: 0.86em; cursor: pointer; margin: 6px 8px 0 0; font-family: inherit; }
  button.btn.sec { background: transparent; color: var(--foreground, #1b1b1f); border: 1px solid var(--border, #dcdce2); }

  .charts { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
  svg { max-width: 100%; height: auto; }

  .summary { font-size: 0.9em; line-height: 1.55; }
  .summary h3 { margin: 18px 0 4px 0; font-size: 1em; }
  .summary ul, .summary ol { margin: 4px 0 4px 18px; padding: 0; }
  .summary li { margin-bottom: 4px; }
  .badge { display: inline-block; font-size: 0.78em; padding: 2px 8px; border-radius: 12px;
           border: 1px solid var(--border, #dcdce2); margin-right: 5px; }
  .warn { border-left: 3px solid #e0a106; padding: 8px 12px; background: var(--card, #f8f8fb);
          border-radius: 0 6px 6px 0; font-size: 0.86em; margin-top: 12px; }
  .todo { border-left: 3px solid var(--accent, #4f7cff); padding: 8px 12px; background: var(--card, #f8f8fb);
          border-radius: 0 6px 6px 0; font-size: 0.86em; margin: 8px 0; }
  table.scoretab { border-collapse: collapse; font-size: 0.84em; margin-top: 8px; }
  table.scoretab th, table.scoretab td { border: 1px solid var(--border, #dcdce2); padding: 4px 9px; text-align: left; }
  table.scoretab th { color: var(--muted-foreground, #6b6b76); font-weight: 600; }
</style>
</head>
<body>
<div class="pl">

    </div>

  <p class="hint" id="plIntro"></p>
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
  <div style="margin:22px 0;">
    <button class="btn sec" id="btnExp" onclick="exportJSON()"></button>
    <button class="btn sec" id="btnImp" onclick="document.getElementById('importFile').click()"></button>
    <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importJSON(event)">
    <button class="btn sec" id="btnPrint" onclick="window.print()"></button>
    <button class="btn sec" id="btnReset" onclick="resetAll()"></button>
    <div class="progress" id="saveStatus"></div>
  </div>
</div>

const KEY = 'pl_landkarte_v4';
let S = {};
try { S = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) { S = {}; }
let lang = (S.__lang === 'en') ? 'en' : 'de';
let T = C[lang];

function get(id, def) { return S[id] !== undefined ? S[id] : def; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
function set(id, v) {
  if (v === undefined) delete S[id]; else S[id] = v;
  save();
  const st = document.getElementById('saveStatus');
  if (st) st.textContent = fmt(T.ui.saved, {t:new Date().toLocaleTimeString()});
  refreshProgress();
  const sp = document.getElementById('panel-sum');
  if (sp && sp.classList.contains('active')) renderSummary();
}
function fmt(s, o) { return String(s).replace(/\{(\w+)\}/g, (m,k) => (o && o[k] !== undefined) ? o[k] : m); }
function escapeHTML(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }

/* ---------------- Sprachumschaltung ---------------- */
function toggleLang() { setLang(lang === 'de' ? 'en' : 'de'); }
function setLang(l) {
  lang = l; T = C[l]; S.__lang = l; save();
  document.documentElement.lang = l;
  document.getElementById('langSwitch').className = 'switch ' + l;
  buildUI();
}

/* ---------------- Scoring (sprachunabhängige IDs) ---------------- */
function qid(dom, dim, i) { return dom + '_' + dim + '_' + i; }
function itemsOf(dom, dim) { const g = T.dom[dom].groups[dim]; return g ? g.items : []; }
function answered(ids) { return ids.map(i => get(i)).filter(v => typeof v === 'number'); }
function mean(a) { return a.length ? a.reduce((x,y)=>x+y,0)/a.length : null; }
function domItemIds(dom) {
  const ids = [];
  DIMKEYS.forEach(dim => itemsOf(dom, dim).forEach((_,i) => ids.push(qid(dom,dim,i))));
  return ids;
}
function dimScore(dom, dim) { return mean(answered(itemsOf(dom,dim).map((_,i)=>qid(dom,dim,i)))); }
function domainScore(dom) { return mean(answered(domItemIds(dom))); }
function domainProgress(dom) { const ids = domItemIds(dom); return {done:answered(ids).length, total:ids.length}; }
function dimAcross(dim) { return mean(DOMKEYS.map(d => dimScore(d,dim)).filter(v => v !== null)); }
function selbstwertScore() { return mean(answered(T.selbstwert.map((_,i)=>'sw_'+i))); }
function bigfiveScores() { return T.bigfive.map((g,gi)=>({dim:g.dim, idx:gi, val:mean(answered(g.items.map((_,i)=>'bf_'+gi+'_'+i)))})); }
function skillScores() { return T.skills.map((c,i)=>({label:c, val:get('sk_'+i,null)})).filter(x=>typeof x.val==='number'); }
function werteSel() { return (get('werte',[]) || []).map(i => T.werte[i]).filter(Boolean); }
function genProgress() {
  const sw = answered(T.selbstwert.map((_,i)=>'sw_'+i)).length;
  let bf = 0; T.bigfive.forEach((g,gi)=>{ bf += answered(g.items.map((_,i)=>'bf_'+gi+'_'+i)).length; });
  return {sw:sw, bf:bf, sk:skillScores().length, werte:(get('werte',[])||[]).length,
          done: sw+bf+skillScores().length, total: T.selbstwert.length + 10 + T.skills.length};
}
function band(v) {
  if (v === null || v === undefined) return 0;
  if (v >= 4.3) return 5; if (v >= 3.7) return 4; if (v >= 3.0) return 3; if (v >= 2.3) return 2; return 1;
}
const bw = v => T.bands[band(v)];
const ba = v => T.bandAdj[band(v)];
const f1 = v => (v === null || v === undefined) ? '–' : v.toFixed(1);

/* ---------------- UI-Aufbau ---------------- */
function scaleRow(container, id, text) {
  const row = el('div','q');
  row.appendChild(el('div','qtext', text));
  const sc = el('div','scale');
  for (let i=1;i<=5;i++) {
    const b = document.createElement('button');
    b.textContent = i; b.dataset.v = i;
    if (get(id) === i) b.className = 'on';
    b.onclick = () => {
      set(id, get(id) === i ? undefined : i);
      Array.from(sc.children).forEach(c => c.className = (get(id) === parseInt(c.dataset.v)) ? 'on' : '');
    };
    sc.appendChild(b);
  }
  row.appendChild(sc);
  container.appendChild(row);
}
function addText(parent, id, placeholder) {
  const t = document.createElement('textarea');
  t.placeholder = placeholder; t.value = get(id,'');
  t.oninput = e => set(id, e.target.value);
  parent.appendChild(t);
}
function glossaryHTML(compact) {
  let h = '<div class="block">';
  DIMKEYS.forEach(k => {
    const x = T.dimdef[k];
    h += '<p style="margin:0 0 10px 0"><b>'+T.axis[k]+'</b> &mdash; '+x.kurz+'<br><span class="muted">'+x.lang
       + ' <b>'+(lang==='de'?'Hohe Werte:':'High scores:')+'</b> '+x.hoch+'. <b>'+(lang==='de'?'Niedrige Werte:':'Low scores:')+'</b> '+x.niedrig+'.'
       + (compact ? '' : '<br><i>'+(lang==='de'?'Hintergrund: ':'Background: ')+x.quelle+'</i>') + '</span></p>';
  });
  return h + '</div>';
}

function showTab(id) {
  window.__curTab = id;
  TABS.forEach(t => {
    const b = document.getElementById('tabbtn-'+t.id), p = document.getElementById('panel-'+t.id);

  });
  if (id === 'sum') renderSummary();
}

/* ---------------- SVG-Diagramme ---------------- */
function cssv(n, fb) { const v = getComputedStyle(document.body).getPropertyValue(n).trim(); return v || fb; }
function sv(name, a) { const e = document.createElementNS('http://www.w3.org/2000/svg', name); for (const k in a) e.setAttribute(k, a[k]); return e; }

function radarSVG(axes, datasets, size) {
  size = size || 500;
  const cx = size/2, cy = size/2 + 6, R = size*0.33;
  const fg = cssv('--foreground','#1b1b1f'), bd = cssv('--border','#d2d2da');
  const svg = sv('svg',{width:size, height:size+70, viewBox:'0 0 '+size+' '+(size+70), id:'radarSvg'});
  const n = axes.length;
  const pt = (i,r) => { const a = -Math.PI/2 + i*2*Math.PI/n; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; };
  for (let ring=1; ring<=5; ring++) {
    let d = ''; const r = R*ring/5;
    for (let i=0;i<n;i++) { const p = pt(i,r); d += (i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1); }
    svg.appendChild(sv('path',{d:d+'Z', fill:'none', stroke:bd, 'stroke-width': ring===5?1.4:0.7}));
  }
  for (let i=0;i<n;i++) {
    const p = pt(i,R);
    svg.appendChild(sv('line',{x1:cx,y1:cy,x2:p[0],y2:p[1],stroke:bd,'stroke-width':0.7}));
    const lp = pt(i,R+24);
    const t = sv('text',{x:lp[0], y:lp[1], fill:fg, 'font-size':12, 'font-family':'system-ui, sans-serif',
      'text-anchor': Math.abs(lp[0]-cx)<6 ? 'middle' : (lp[0]>cx ? 'start':'end'), 'dominant-baseline':'middle'});
    t.textContent = axes[i]; svg.appendChild(t);
  }
  datasets.forEach(ds => {
    const complete = ds.values.every(v => typeof v === 'number');
    if (complete && n > 2) {
      let d = '';
      ds.values.forEach((v,i) => { const p = pt(i, R*v/5); d += (i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1); });
      svg.appendChild(sv('path',{d:d+'Z', fill:ds.color, 'fill-opacity':0.13, stroke:ds.color, 'stroke-width':2}));
    } else {
      const pts = [];
      ds.values.forEach((v,i) => { if (typeof v === 'number') pts.push(pt(i, R*v/5)); });
      pts.forEach((p,k) => { if (k) svg.appendChild(sv('line',{x1:pts[k-1][0],y1:pts[k-1][1],x2:p[0],y2:p[1],
        stroke:ds.color,'stroke-width':1.5,'stroke-dasharray':'4 3'})); });
    }
    ds.values.forEach((v,i) => { if (typeof v === 'number') { const p = pt(i,R*v/5);
      svg.appendChild(sv('circle',{cx:p[0],cy:p[1],r:3.2,fill:ds.color})); } });
  });
  datasets.forEach((ds,i) => {
    const y = size + 14 + i*16;
    svg.appendChild(sv('rect',{x:14,y:y-8,width:11,height:11,rx:2,fill:ds.color}));
    const t = sv('text',{x:31,y:y,fill:fg,'font-size':12,'font-family':'system-ui, sans-serif','dominant-baseline':'middle'});
    t.textContent = ds.label + (ds.note ? ' ' + ds.note : ''); svg.appendChild(t);
  });
  return svg;
}

function barSVG(rows, opts) {
  opts = opts || {};
  const w = opts.width || 460, lw = opts.labelWidth || 215, rowH = 22, pad = 10;
  const h = rows.length*rowH + pad*2 + 18;
  const fg = cssv('--foreground','#1b1b1f'), bd = cssv('--border','#d2d2da'), acc = cssv('--accent','#4f7cff');
  const svg = sv('svg',{width:w, height:h, viewBox:'0 0 '+w+' '+h, id: opts.id || 'barSvg'});
  const barW = w - lw - 46;
  for (let i=1;i<=5;i++) {
    const x = lw + barW*i/5;
    svg.appendChild(sv('line',{x1:x,y1:pad-4,x2:x,y2:h-20,stroke:bd,'stroke-width':0.6}));
    const t = sv('text',{x:x,y:h-7,fill:fg,'font-size':10,'font-family':'system-ui, sans-serif','text-anchor':'middle',opacity:0.6});
    t.textContent = i; svg.appendChild(t);
  }
  rows.forEach((r,i) => {
    const y = pad + i*rowH;
    const lt = sv('text',{x:0,y:y+rowH/2,fill:fg,'font-size':11.5,'font-family':'system-ui, sans-serif','dominant-baseline':'middle'});
    lt.textContent = r.label; svg.appendChild(lt);
    if (typeof r.val === 'number') {
      svg.appendChild(sv('rect',{x:lw,y:y+4,width:Math.max(2,barW*r.val/5),height:rowH-9,rx:3,fill:r.color||acc}));
      const vt = sv('text',{x:lw+barW+6,y:y+rowH/2,fill:fg,'font-size':11,'font-family':'system-ui, sans-serif','dominant-baseline':'middle'});
      vt.textContent = r.val.toFixed(1); svg.appendChild(vt);
    } else {
      const vt = sv('text',{x:lw+4,y:y+rowH/2,fill:fg,'font-size':11,'font-family':'system-ui, sans-serif','dominant-baseline':'middle',opacity:0.5});
      vt.textContent = T.ui.noData; svg.appendChild(vt);
    }
  });
  return svg;
}

function downloadSVG(id, filename) {
  const svg = document.getElementById(id); if (!svg) return;
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  clone.insertBefore(sv('rect',{x:0,y:0,width:clone.getAttribute('width'),height:clone.getAttribute('height'),fill:'#ffffff'}), clone.firstChild);
  clone.querySelectorAll('text').forEach(t => t.setAttribute('fill','#1b1b1f'));
  const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(clone));
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = img.width*2; c.height = img.height*2;
    const ctx = c.getContext('2d'); ctx.scale(2,2); ctx.drawImage(img,0,0);
    const a = document.createElement('a'); a.download = filename+'.png'; a.href = c.toDataURL('image/png'); a.click();
  };
  img.onerror = () => { const a = document.createElement('a'); a.download = filename+'.svg'; a.href = url; a.click(); };
  img.src = url;
}

/* ---------------- Skizze ---------------- */
function buildSketch() {
  const s = T.s;
  let out = '', secNo = 0;
  const H = t => '<h3>' + (++secNo) + '. ' + t + '</h3>';

  const doms = DOMKEYS.map(k=>({k, label:T.dom[k].label, v:domainScore(k)})).filter(x=>x.v!==null).sort((a,b)=>b.v-a.v);
  const rows = DIMKEYS.map(k=>({k, axis:T.axis[k], v:dimAcross(k)})).filter(x=>x.v!==null).sort((a,b)=>b.v-a.v);
  const sw = selbstwertScore();
  const bfs = bigfiveScores().filter(b=>b.val!==null);
  const sks = skillScores();
  const werte = werteSel();

  /* 1 Gesamtbild */
  const overall = mean(doms.map(x=>x.v));
  if (overall !== null) {
    out += H(s.h1);
    const spread = doms.length>1 ? Math.max(...doms.map(x=>x.v))-Math.min(...doms.map(x=>x.v)) : 0;
    out += '<p>' + fmt(s.overall,{avg:f1(overall), band:bw(overall)});
    out += fmt(spread>=1.2 ? s.spreadHigh : (spread>=0.6 ? s.spreadMid : s.spreadLow), {spread:f1(spread)}) + '</p>';
  }

  /* 2 Bereiche */
  out += H(s.h2) + '<ul>';
  doms.forEach((x,i) => {
    const role = i===0 ? s.roleTop : (i===doms.length-1 ? s.roleBottom : s.roleMid);
    out += '<li>' + fmt(s.domLine,{dom:x.label, v:f1(x.v), band:bw(x.v), role:role});
    const dd = DIMKEYS.map(k=>({k, axis:T.axis[k], v:dimScore(x.k,k)})).filter(y=>y.v!==null).sort((a,b)=>b.v-a.v);
    if (dd.length>=2) {
      const hi = dd[0], lo = dd[dd.length-1];
      out += fmt(s.domHiLo,{hi:hi.axis, hiv:f1(hi.v), hitext:T.dimdef[hi.k].hoch, lo:lo.axis, lov:f1(lo.v), lotext:T.dimdef[lo.k].niedrig});
    }
    out += '</li>';
  });
  out += '</ul>';

  /* 3 Roter Faden */
  if (rows.length>=3) {
    out += H(s.h3);
    out += '<p>' + fmt(s.rfIntro,{d1:rows[0].axis, v1:f1(rows[0].v), d2:rows[1].axis, v2:f1(rows[1].v),
      dl:rows[rows.length-1].axis, vl:f1(rows[rows.length-1].v)}) + '</p>';

    out += '<h4>'+s.h4a+'</h4>';
    const pil = rows.filter(x=>x.v>=3.7), mid = rows.filter(x=>x.v<3.7&&x.v>=3.0), bau = rows.filter(x=>x.v<3.0);
    if (pil.length) {
      out += '<p>'+s.pillars+'</p><ul>';
      pil.forEach(x => out += '<li><b>'+x.axis+'</b> ('+f1(x.v)+') — '+T.dimdef[x.k].hoch+'. '+T.dimdef[x.k].wirkung+'</li>');
      out += '</ul>';
    } else out += '<p>'+fmt(s.pillarsNone,{d:rows[0].axis, v:f1(rows[0].v)})+'</p>';
    if (mid.length) out += '<p>'+fmt(s.middle,{list:mid.map(x=>x.axis+' ('+f1(x.v)+')').join(', ')})+'</p>';
    if (bau.length) {
      out += '<p>'+s.sites+'</p><ul>';
      bau.forEach(x => out += '<li><b>'+x.axis+'</b> ('+f1(x.v)+') — '+T.dimdef[x.k].niedrig+'. '+T.dimdef[x.k].mangel+'</li>');
      out += '</ul>';
    } else out += '<p>'+s.sitesNone+'</p>';

    const spreads = DIMKEYS.map(k => {
      const vals = DOMKEYS.map(d=>({label:T.dom[d].label, v:dimScore(d,k)})).filter(x=>x.v!==null);
      if (vals.length<2) return null;
      const srt = vals.slice().sort((a,b)=>b.v-a.v);
      return {k, axis:T.axis[k], hi:srt[0], lo:srt[srt.length-1], spread:srt[0].v-srt[srt.length-1].v};
    }).filter(Boolean).sort((a,b)=>b.spread-a.spread);
    if (spreads.length) {
      out += '<h4>'+s.h4b+'</h4>';
      const w = spreads[0], st = spreads[spreads.length-1];
      out += '<p>' + (w.spread>=1.2
        ? fmt(s.ctxHigh,{d:w.axis, hi:w.hi.label, hiv:f1(w.hi.v), lo:w.lo.label, lov:f1(w.lo.v), spread:f1(w.spread)})
        : fmt(s.ctxLow,{d:w.axis, spread:f1(w.spread)})) + '</p>';
      if (st.spread<=0.6) out += '<p>'+fmt(s.ctxStable,{d:st.axis, spread:f1(st.spread)})+'</p>';
      const more = spreads.filter(x=>x!==w&&x!==st&&x.spread>=1.0).slice(0,3);
      if (more.length) out += '<p>'+fmt(s.ctxMore,{list:more.map(x=>fmt(s.ctxMoreItem,{d:x.axis, hi:x.hi.label, lo:x.lo.label})).join('; ')})+'</p>';
    }

    const q = [];
    const kom = dimAcross('kompetenz'), ver = dimAcross('verbundenheit'), aut = dimAcross('autonomie'),
          bel = dimAcross('belastbarkeit'), sta = dimAcross('staerken'), ges = dimAcross('gestaltung'), zuf = dimAcross('zufriedenheit');
    const bfv = {}; bfs.forEach(b => bfv[b.idx] = b.val);   // 0=O 1=C 2=E 3=A 4=N
    const P = (tpl,a,b) => q.push(fmt(tpl,{a:f1(a), b:f1(b)}));
    if (sw!==null && kom!==null && kom-sw>=0.7) P(s.qKomSw, kom, sw);
    if (sw!==null && kom!==null && sw-kom>=0.7) P(s.qSwKom, sw, kom);
    if (sta!==null && ges!==null && sta-ges>=0.7) P(s.qStaGes, sta, ges);
    if (ges!==null && sta!==null && ges-sta>=0.7) P(s.qGesSta, ges, sta);
    if (zuf!==null && bel!==null && zuf-bel>=0.8) P(s.qZufBel, zuf, bel);
    if (kom!==null && zuf!==null && kom-zuf>=0.8) P(s.qKomZuf, kom, zuf);
    if (ver!==null && aut!==null && ver-aut>=0.8) P(s.qVerbAut, ver, aut);
    if (aut!==null && ver!==null && aut-ver>=0.8) P(s.qAutVerb, aut, ver);
    if (bel!==null && bel<=2.6) q.push(fmt(s.qBelLow,{a:f1(bel)}));
    if (bfv[1]!==undefined && bfv[1]>=4 && bel!==null && bel<=3.0) P(s.qGewBel, bfv[1], bel);
    if (bfv[3]!==undefined && bfv[3]>=4 && aut!==null && aut<=3.2) P(s.qVerAut, bfv[3], aut);
    if (bfv[4]!==undefined && bfv[4]<=2.6 && bel!==null && bel<=3.2) P(s.qStaBel, bfv[4], bel);
    if (bfv[2]!==undefined && bfv[2]<=2.6 && ver!==null && ver>=3.7) P(s.qExtVerb, bfv[2], ver);
    if (bfv[0]!==undefined && bfv[0]>=4 && ges!==null && ges<=3.0) P(s.qOffGes, bfv[0], ges);
    if (q.length) { out += '<h4>'+s.h4c+'</h4><ul>'; q.forEach(x=>out+='<li>'+x+'</li>'); out += '</ul>'; }

    const low = rows[rows.length-1];
    out += '<h4>'+s.h4d+'</h4><p>'+fmt(s.lever,{d:low.axis, v:f1(low.v), hebel:T.dimdef[low.k].hebel})+'</p>';
  }

  /* 4 Selbstwert */
  if (sw !== null) {
    out += H(s.hSw) + '<p>' + fmt(s.swIntro,{v:f1(sw), band:bw(sw)});
    const b = band(sw);
    out += (b>=4 ? s.swHigh : (b===3 ? s.swMid : s.swLow));
    const lowest = T.selbstwert.map((t,i)=>({t, v:get('sw_'+i)})).filter(x=>typeof x.v==='number').sort((a,b)=>a.v-b.v);
    if (lowest.length && lowest[0].v<=2) out += fmt(s.swHardest,{t:lowest[0].t});
    out += '</p>';
  }

  /* 5 Big Five */
  if (bfs.length>=3) {
    const srt = bfs.slice().sort((a,b)=>b.val-a.val);
    out += H(s.hBf) + '<p>' + fmt(s.bfIntro,{d1:srt[0].dim, v1:f1(srt[0].val), d2:srt[1].dim, v2:f1(srt[1].val),
      dl:srt[srt.length-1].dim, vl:f1(srt[srt.length-1].val)});
    out += (T.bfmap[srt[0].dim] || '') + ' ';
    const last = srt[srt.length-1];
    if (last.idx === 4 && last.val <= 2.6) out += s.bfStabLow;
    out += '</p>';
  }

  /* 6 Fähigkeiten */
  if (sks.length>=3) {
    const srt = sks.slice().sort((a,b)=>b.val-a.val);
    out += H(s.hSk) + '<p>' + fmt(s.skIntro,{
      top: srt.slice(0,3).map(x=>x.label+' ('+x.val+')').join(', '),
      low: srt.slice(-3).map(x=>x.label+' ('+x.val+')').join(', ')}) + '</p>';
  }
  const sktxt = get('sk_txt','').trim();
  if (sktxt) out += '<p class="muted">'+fmt(s.skTxt,{t:escapeHTML(sktxt)})+'</p>';

  /* 7 Werte */
  if (werte.length) {
    out += H(s.hW) + '<p>' + fmt(s.wIntro,{list:werte.join(', ')});
    const found = T.conflicts.filter(pr => werte.includes(pr[0]) && werte.includes(pr[1]));
    out += found.length ? fmt(s.wConflict,{list:found.map(pr=>pr[0]+' \u2194 '+pr[1]).join(lang==='de'?' und ':' and ')}) : s.wHarmony;
    out += '</p>';
    const lowDom = doms.length ? doms[doms.length-1] : null;
    if (lowDom && lowDom.v < 3) out += '<p>'+fmt(s.wLowDom,{dom:lowDom.label})+'</p>';
  }

  /* 8 Eigene Worte */
  const fs = DOMKEYS.map(k => ({label:T.dom[k].label, str:get(k+'_txt_str','').trim(),
    sch:get(k+'_txt_sch','').trim(), res:get(k+'_txt_res','').trim()})).filter(x=>x.str||x.sch||x.res);
  if (fs.length) {
    out += H(s.hOwn) + '<ul>';
    fs.forEach(x => {
      out += '<li><b>'+x.label+'</b>';
      if (x.str) out += '<br><span class="badge">'+s.bStr+'</span>'+escapeHTML(x.str);
      if (x.sch) out += '<br><span class="badge">'+s.bSch+'</span>'+escapeHTML(x.sch);
      if (x.res) out += '<br><span class="badge">'+s.bRes+'</span>'+escapeHTML(x.res);
      out += '</li>';
    });
    out += '</ul>';
  }

  /* 9 Empfehlungen */
  const combos = [];
  DOMKEYS.forEach(k => DIMKEYS.forEach(dim => {
    const v = dimScore(k,dim);
    if (v !== null) combos.push({dk:k, dom:T.dom[k].label, dim:dim, axis:T.axis[dim], v:v});
  }));
  combos.sort((a,b)=>a.v-b.v);
  if (combos.length) {
    out += H(s.hRec) + '<ol>';
    combos.slice(0,3).forEach(c => out += '<li><b>'+c.dom+' → '+c.axis+'</b> ('+f1(c.v)+'): '+((T.tipps[c.dk]||{})[c.dim]||'')+'</li>');
    out += '</ol>';
    const strong = combos.slice(-3).reverse();
    out += '<p>'+fmt(s.recBuild,{list:strong.map(c=>c.dom+' → '+c.axis+' ('+f1(c.v)+')').join(', ')})+'</p>';
  }

  /* 10 Kurzform */
  if (doms.length && rows.length) {
    out += H(s.hShort);
    const top = doms[0], bot = doms[doms.length-1];
    const srtBf = bfs.slice().sort((a,b)=>b.val-a.val);
    out += '<p>'+fmt(s.shortPic,{arch:T.arch[rows[0].k], bf: srtBf.length ? ' — '+T.bft[srtBf[0].idx] : ''})+'</p>';
    let t = fmt(s.shortP1,{d1:rows[0].axis, v1:f1(rows[0].v)});
    if (rows.length>1) t += fmt(s.shortP1b,{d2:rows[1].axis, v2:f1(rows[1].v)});
    t += fmt(s.shortP2,{top:top.label, topv:f1(top.v)});
    if (bot !== top) {
      const dd = DIMKEYS.map(k=>({axis:T.axis[k], v:dimScore(bot.k,k)})).filter(x=>x.v!==null).sort((a,b)=>a.v-b.v);
      if (dd.length) t += fmt(s.shortP3,{bot:bot.label, botv:f1(bot.v), dim:dd[0].axis, dimv:f1(dd[0].v)});
    }
    if (srtBf.length) {
      t += fmt(s.shortP4,{bft:T.bft[srtBf[0].idx], dim:srtBf[0].dim, v:f1(srtBf[0].val)});
      if (srtBf.length>1) t += fmt(s.shortP4b,{dim:srtBf[srtBf.length-1].dim, v:f1(srtBf[srtBf.length-1].val)});
      t += '. ';
    }
    if (sw !== null) {
      const b = band(sw);
      t += fmt(s.shortP5,{v:f1(sw), band:bw(sw), txt: b>=4 ? s.swBase5 : (b===3 ? s.swBase3 : s.swBase1)});
    }
    if (werte.length) t += fmt(s.shortP6,{list:werte.slice(0,5).join(', ')});
    out += '<p>'+t+'</p>';

    const best = DOMKEYS.map(k=>({label:T.dom[k].label, v:dimScore(k,rows[0].k)})).filter(x=>x.v!==null).sort((a,b)=>b.v-a.v);
    out += '<p>' + fmt(s.shortRes,{d:rows[0].axis, dom: best.length?best[0].label:'–', v: best.length?f1(best[0].v):'–'})
         + '<br>' + fmt(s.shortRisk,{t:T.risiko[rows[rows.length-1].k]}) + '</p>';

    const ziel = DOMKEYS.map(k=>({label:T.dom[k].label, t:get(k+'_txt_ziel','').trim()})).filter(z=>z.t);
    out += '<p>' + (ziel.length ? fmt(s.shortStep,{dom:ziel[0].label, t:escapeHTML(ziel[0].t)}) : s.shortNoStep) + '</p>';

    out += '<p>' + fmt(s.oneLine,{d:rows[0].axis, top:top.label,
      bot: (bot!==top) ? fmt(s.oneLineBot,{bot:bot.label}) : '',
      band: sw!==null ? ba(sw) : T.bandAdj[0]}) + '</p>';
  }
  return out;
}

/* Start */
buildUI();
</script>
